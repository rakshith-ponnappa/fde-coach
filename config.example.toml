[search]
# EXAMPLE VALUES - replace them with the places you can actually work.
# On-site/hybrid regions you can work in, in order of preference (first is listed first).
# Any name defined under [regions] below can be used.
regions = ["us", "uk", "eu"]
# Also keep remote roles that are open to one of these regions, or that name no region at all.
remote_ok = true
remote_open_to = ["anywhere"]

# Regular expressions (case-insensitive) that decide which region a location string is in.
# 'elsewhere' only exists so that e.g. "Remote - Canada" is recognised and dropped.
[regions]
india = '\bindia\b|hyderabad|pune|chennai|mumbai|gurgaon|gurugram|noida|delhi'
# 'uae' covers the UAE and the rest of the Gulf / Middle East.
uae = 'united arab emirates|\buae\b|dubai|abu dhabi|middle east|\bmena\b|saudi|riyadh|qatar|doha|bahrain|kuwait|\boman\b'
singapore = 'singapore'
uk = 'united kingdom|\buk\b|london|manchester|edinburgh|cambridge, uk|bristol|england|scotland'
eu = 'europe|\bemea\b|\beu\b|ireland|dublin|netherlands|amsterdam|germany|berlin|munich|france|paris|spain|madrid|barcelona|portugal|lisbon|sweden|stockholm|denmark|copenhagen|finland|helsinki|poland|warsaw|italy|milan|belgium|brussels|austria|vienna|czech|prague|switzerland|zurich'
# US cities and states. Remote roles for 'AMER' / 'Americas' are counted as US.
us = 'united states|\busa?\b|u\.s\.|\bamer\b|americas|north america|\bfederal\b|new york|nyc|san francisco|bay area|seattle|boston|austin|chicago|los angeles|denver|atlanta|palo alto|mountain view|washington|d\.c\.|\b(alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|georgia|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new hampshire|new jersey|new mexico|north carolina|north dakota|ohio|oklahoma|oregon|pennsylvania|rhode island|south carolina|south dakota|tennessee|texas|utah|vermont|virginia|wisconsin|wyoming)\b|, (ca|ny|wa|tx|ma|il|co|ga|va|nc|fl)\b'
apac = '\bapac\b|asia'
anywhere = 'anywhere|worldwide|\bglobal\b|international'
elsewhere = 'canada|toronto|vancouver|montreal|mexico|brazil|latam|argentina|colombia|australia|sydney|melbourne|new zealand|japan|tokyo|korea|seoul|china|beijing|shanghai|hong kong|taiwan|israel|tel aviv|south africa'

# Job titles, checked in order A -> B -> C after 'exclude'. Remove a language from 'exclude' if you speak it.
[tiers]
A = 'forward[- ]deploy|\bfde\b|deployment engineer|deployed engineer|deployment strategist'
B = 'applied ai|\bai engineer|\bllm\b|gen ?ai|generative ai|agent engineer|ai agent|agentic|ai solutions|solutions? (engineer|architect)|solution architect|customer engineer|field engineer|ai platform|ml platform|machine learning engineer|\bml engineer|ai infrastructure|ml infrastructure|implementation engineer|technical deployment'
C = 'platform engineer|infrastructure engineer|site reliability|\bsre\b|devops|cloud engineer|cloud architect|kubernetes|production engineer|reliability engineer'
exclude = '\bintern\b|internship|new grad|early (talent|career)|graduate|apprentice|recruit|account executive|sales development|marketing|counsel|designer|front[- ]?end|\bdirector\b|vice president|\bvp\b|product manager|technician|electrical|mechanical|hardware|mandarin|japanese|korean|french speak|german speak|spanish speak|italian speak'

# Skills counted by `fde jobs skills` and the report's "market pulse" (case-insensitive regex).
[skill_keywords]
"Python" = '\bpython\b'
"TypeScript / JavaScript" = 'typescript|javascript|node\.js|react'
"SQL" = '\bsql\b|postgres'
"LLMs / prompting" = '\bllms?\b|large language model|prompt'
"RAG / retrieval" = '\brag\b|retrieval|vector (db|database|search|store)|embedding'
"Agents / tool use" = '\bagents?\b|agentic|tool[- ]use|function calling'
"MCP" = '\bmcp\b|model context protocol'
"Evals" = '\bevals?\b|evaluation'
"Fine-tuning / post-training" = 'fine[- ]tun|post[- ]training|\brlhf\b|\blora\b'
"Knowledge graphs" = 'knowledge graph|graph ?rag|neo4j|ontolog'
"Data pipelines / ETL" = 'data pipeline|\betl\b|\belt\b|airflow|dagster|\bdbt\b|spark|kafka|ingestion'
"Distributed systems" = 'distributed system'
"Kubernetes / containers" = 'kubernetes|\bk8s\b|docker|container'
"Cloud (AWS / Azure / GCP)" = '\baws\b|azure|\bgcp\b|google cloud'
"Terraform / IaC" = 'terraform|infrastructure as code|\biac\b|pulumi'
"APIs / backend" = '\bapis?\b|backend|fastapi|restful'
"ML fundamentals" = 'machine learning|\bml\b|pytorch|scikit|model training'
"Customer-facing" = 'customer[- ]facing|client[- ]facing|stakeholder|work(ing)? (directly )?with customers'
"Security, compliance & private deployments" = 'security (review|requirement|posture|control)s?|compliance (requirement|framework|standard)s?|regulatory|regulated|\bsoc ?2\b|hipaa|gdpr|fedramp|data residency|on-?prem|air-?gapped|\bvpc\b|private cloud'
"Travel required" = '\btravel(ing|ling)? (up to|is required|required|requirement|\d+|to (customer|client)|on-?site|as needed|frequently|regularly|extensively)|willing(ness)? to travel|\d+ ?%[^.]{0,20}travel|\btravel[^.]{0,20}\d+ ?%'

# LinkedIn searches built by `fde jobs links` (you open them; nothing is scraped).
[linkedin]
posted_within = "r86400"  # r86400 = last 24 hours, r604800 = last week
queries = [
  '"forward deployed"',
  '"applied AI" OR "AI engineer" OR "AI solutions architect"',
  '"AI platform engineer" OR "LLMOps" OR "AI infrastructure engineer"',
]
# EXAMPLE VALUES - one set of searches per location; remote = true adds LinkedIn's "Remote" filter.
locations = [
  { label = "Remote (US)", name = "United States", remote = true },
  { label = "US", name = "United States" },
  { label = "UK", name = "United Kingdom" },
  { label = "EU", name = "European Union" },
]

