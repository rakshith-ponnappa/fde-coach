# config.example.toml - example settings for the job finder.
#
# Make your own copy (config.toml is gitignored, so your preferences stay private):
#   cp config.example.toml config.toml
# then edit config.toml and run: fde jobs fetch
# Until config.toml exists, the coach reads this file instead.
#
# Every company below answered on its public job-board API on 2026-11-10.
