name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install. Tests run offline (HTTP is mocked).
      - name: Test
        run: python -m unittest discover -v
      - name: CLI smoke test
        run: |
          ./fde --help
          ./fde plan > /dev/null
