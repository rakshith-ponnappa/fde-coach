baseline = 0
target = 4

[[skills]]
key = "llmops"
name = "Deploying & operating AI systems (LLMOps, security, cost)"
baseline = 1
target = 5

[[skills]]
key = "data_pipelines"
name = "Data pipelines (batch & streaming)"
