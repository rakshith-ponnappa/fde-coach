name = "Cloud platforms incl. AI services (Azure / AWS / GCP)"
baseline = 4
target = 5

[[skills]]
key = "iac_cicd"
name = "Infrastructure as code & CI/CD"
baseline = 4
target = 5

[[skills]]
key = "containers"
name = "Docker & Kubernetes"
baseline = 3
target = 4

[[skills]]
key = "llm"
name = "LLM APIs, prompting & structured outputs"
baseline = 0
target = 4

[[skills]]
key = "rag"
name = "RAG & search"
baseline = 0
target = 4

[[skills]]
key = "agents"
name = "Agents, tool use & MCP"
baseline = 0
target = 4

[[skills]]
key = "evals"
