# curriculum.toml - your plan, read by `fde today`, `fde plan` and `fde week show N`.
#
# Weeks 1-16  = SPRINT to job-ready. Start applying in weeks 8-10 (see each phase's job_focus).
# Weeks 17-26 = DEPTH TRACK while you interview / in your new job (deeper data, ML, graphs, infra).
# Edit anything you like; `python3 -m unittest` checks that the file is still consistent.

[daily]
default = [
  "0:00-1:30  LEARN     this week's main resource; pause videos and type every example yourself",
  "1:30-1:40  break     stand up, water, no phone",
  "1:40-3:10  BUILD     exercises / this week's deliverable (Copilot inline suggestions OFF while learning)",
  "3:10-3:20  break",
  "3:20-3:45  PRACTICE  {practice}",
  '3:45-4:00  WRAP UP   fde log 4 "what I did"; 3 lines in notes/learning-log.md; skim fde jobs list',
]
sunday = [
  "0:00-2:00  BUILD     finish this week's deliverable and push it to GitHub",
  "2:00-2:10  break",
  "2:10-3:10  REVIEW    redo 2 things you struggled with this week, from memory",
  "3:10-3:40  REFLECT   fde report --write; fde skills set ...; fde week done (if the deliverable is done)",
  "3:40-4:00  SHARE     post 3-5 lines on LinkedIn about what you built (learning in public)",
]

# Levels: 0 none, 1 aware, 2 guided, 3 independent, 4 production, 5 expert.
# Baselines describe the intended starting point (an experienced cloud/platform engineer who is new
# to Python and AI). Correct them for yourself on day 1 with `fde skills set KEY LEVEL`.
